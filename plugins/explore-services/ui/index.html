<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>探索服务</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --bg: #101417; --surface: #192024; --surface-2: #222b30; --text: #f3f6f4; --muted: #a6b0b0; --border: #344147; --accent: #f0b43c; --danger: #ef8f8f; }
    @media (prefers-color-scheme: light) { :root { --bg: #f5f6f4; --surface: #fff; --surface-2: #eef1ef; --text: #202525; --muted: #687274; --border: #d8dfdc; --accent: #b27600; --danger: #b42318; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    button, select { font: inherit; }
    .explore { max-width: 1440px; margin: 0 auto; padding: 28px clamp(16px, 3vw, 42px) 48px; }
    body.embedded .head { display: none; }
    body.embedded .explore { max-width: none; padding: 12px clamp(12px, 2vw, 24px) 36px; }
    body.embedded .grid { grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); }
    .head, .toolbar, .source-tabs, .filters, .status, .pager { display: flex; align-items: center; }
    .head { justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    h1 { margin: 0; font-size: clamp(24px, 3vw, 34px); letter-spacing: 0; }
    .head p { margin: 7px 0 0; color: var(--muted); }
    .toolbar { gap: 8px; flex-wrap: wrap; }
    button, select { border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text); cursor: pointer; }
    button { padding: 9px 13px; }
    button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    button:disabled { cursor: not-allowed; opacity: .45; }
    .source-tabs { gap: 7px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; }
    .source-tabs button.active, .filters button.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 17%, var(--surface)); color: var(--accent); }
    .filters { gap: 8px; flex-wrap: wrap; margin: 12px 0 16px; }
    .filters label { display: flex; align-items: center; gap: 7px; color: var(--muted); }
    .status { justify-content: space-between; gap: 12px; min-height: 42px; margin-bottom: 18px; padding: 10px 13px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface-2); color: var(--muted); font-size: 13px; }
    .status.error { border-color: color-mix(in srgb, var(--danger) 60%, var(--border)); color: var(--danger); }
    .status.stale { border-color: #ba8b35; color: #d9b15e; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 16px; }
    .card { min-width: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); }
    .poster { aspect-ratio: 2 / 3; background: var(--surface-2); }
    .poster img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: 11px; }
    .title { display: -webkit-box; min-height: 3em; margin: 0 0 8px; overflow: hidden; color: var(--text); line-height: 1.5; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .meta { display: flex; justify-content: space-between; gap: 6px; color: var(--muted); font-size: 12px; }
    .score { color: var(--accent); }
    .badge { display: inline-block; max-width: 100%; margin-top: 8px; overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .empty { padding: 72px 20px; border: 1px dashed var(--border); color: var(--muted); text-align: center; }
    .pager { justify-content: center; gap: 15px; margin-top: 28px; }
    .pager span { color: var(--muted); font-size: 13px; }
    @media (max-width: 640px) { .explore { padding: 20px 12px 36px; } .head { align-items: flex-start; flex-direction: column; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .status { align-items: flex-start; flex-direction: column; } .filters { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 5px; } .filters label { flex: 0 0 auto; } }
  </style>
</head>
<body>
  <main class="explore" id="app">
    <header class="head">
      <div><h1>探索服务</h1><p>浏览公开影视目录，选择感兴趣的内容</p></div>
      <div class="toolbar"><button type="button" id="refresh">刷新</button><button type="button" id="health">连接测试</button></div>
    </header>
    <nav class="source-tabs" id="sources" aria-label="探索来源"></nav>
    <section class="filters" id="filters"></section>
    <div class="status" id="status">正在加载探索来源...</div>
    <section class="grid" id="grid"></section>
    <div class="empty" id="empty" hidden>当前没有可显示的内容</div>
    <nav class="pager"><button type="button" id="prev">上一页</button><span id="page">第 1 页</span><button type="button" id="next">下一页</button></nav>
  </main>
  <script>
    const embedded = new URLSearchParams(window.location.search).get('embedded') === '1'
    if (embedded) document.body.classList.add('embedded')
    const state = { sources: [], source: '', category: 'bangumi', sort: '', filters: {}, page: 1, loading: false }
    const $ = (id) => document.getElementById(id)
    const sourceEl = $('sources'), filtersEl = $('filters'), gridEl = $('grid'), statusEl = $('status'), emptyEl = $('empty')
    function call(name, args) { return window.MopiePlugin.callTool(name, args || {}, false) }
    function setStatus(text, kind) { statusEl.textContent = text; statusEl.className = 'status' + (kind ? ' ' + kind : '') }
    function currentSource() { return state.sources.find((item) => item.id === state.source) }
    function renderSources() {
      sourceEl.innerHTML = ''
      state.sources.forEach((source) => {
        const button = document.createElement('button'); button.type = 'button'; button.textContent = source.title; button.className = source.id === state.source ? 'active' : ''
        button.onclick = () => { state.source = source.id; state.category = source.categories[0]?.id || ''; state.filters = {}; state.page = 1; renderSources(); renderFilters(); load() }; sourceEl.append(button)
      })
    }
    function renderFilters() {
      filtersEl.innerHTML = ''
      const source = currentSource(); if (!source) return
      const category = document.createElement('select'); category.setAttribute('aria-label', '内容分类')
      source.categories.forEach((item) => { const option = document.createElement('option'); option.value = item.id; option.textContent = item.title; option.selected = item.id === state.category; category.append(option) })
      category.onchange = () => { state.category = category.value; state.filters = {}; state.page = 1; renderFilters(); load() }; filtersEl.append(category)
      const sort = document.createElement('select'); sort.setAttribute('aria-label', '排序方式'); const defaultOption = document.createElement('option'); defaultOption.value = ''; defaultOption.textContent = '默认排序'; sort.append(defaultOption)
      source.sorts.forEach((item) => { const option = document.createElement('option'); option.value = item.value; option.textContent = item.label; option.selected = item.value === state.sort; sort.append(option) })
      sort.onchange = () => { state.sort = sort.value; state.page = 1; load() }; filtersEl.append(sort)
      if (state.category === 'bangumi' || state.category === 'guo') addFilter('状态', 'is_finish', [{ value: '0', label: '连载' }, { value: '1', label: '完结' }])
      if (state.category === 'tv') addFilter('地区', 'area', [{ value: '1,6,7', label: '中国' }, { value: '2', label: '日本' }, { value: '3', label: '美国' }])
      if (state.category === 'bangumi') addFilter('配音', 'spoken_language_type', [{ value: '1', label: '原声' }, { value: '2', label: '中文配音' }])
    }
    function addFilter(label, key, options) {
      const select = document.createElement('select'); select.setAttribute('aria-label', label); const all = document.createElement('option'); all.value = ''; all.textContent = label; select.append(all)
      options.forEach((item) => { const option = document.createElement('option'); option.value = item.value; option.textContent = item.label; option.selected = state.filters[key] === item.value; select.append(option) })
      select.onchange = () => { if (select.value) state.filters[key] = select.value; else delete state.filters[key]; state.page = 1; load() }; filtersEl.append(select)
    }
    function renderItems(result) {
      gridEl.innerHTML = ''; emptyEl.hidden = result.items.length > 0
      result.items.forEach((item) => {
        const card = document.createElement('article'); card.className = 'card'; const poster = document.createElement('div'); poster.className = 'poster'
        if (item.posterUrl) { const image = document.createElement('img'); image.src = item.posterUrl; image.alt = item.title; image.loading = 'lazy'; image.referrerPolicy = 'no-referrer'; poster.append(image) }
        const body = document.createElement('div'); body.className = 'card-body'; const title = document.createElement('p'); title.className = 'title'; title.textContent = item.title; body.append(title)
        const meta = document.createElement('div'); meta.className = 'meta'; const type = document.createElement('span'); type.textContent = item.year ? item.year + ' · ' + item.mediaType : item.mediaType; meta.append(type)
        if (item.score != null) { const score = document.createElement('span'); score.className = 'score'; score.textContent = item.scoreSource + ' ' + item.score.toFixed(1); meta.append(score) }; body.append(meta)
        if (item.status === 'finished' || item.episodeText) { const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = [item.status === 'finished' ? '完结' : '连载', item.episodeText].filter(Boolean).join(' · '); body.append(badge) }
        card.append(poster, body); card.onclick = () => { if (item.sourceUrl) window.open(item.sourceUrl, '_blank', 'noopener,noreferrer') }; gridEl.append(card)
      })
      const pageInfo = result.pagination || {}; $('page').textContent = '第 ' + (pageInfo.page || state.page) + ' 页'; $('prev').disabled = state.page <= 1; $('next').disabled = pageInfo.hasNext === false || result.items.length === 0
    }
    async function load() {
      if (state.loading || !state.source) return; state.loading = true; setStatus('正在获取 ' + (currentSource()?.title || '') + ' 内容...', ''); gridEl.innerHTML = ''
      try { const response = await call('explore.list', { source: state.source, category: state.category, page: state.page, pageSize: 20, sort: state.sort, filters: state.filters }); const result = response.result || response; renderItems(result); const cache = result.cache || {}; setStatus(cache.state === 'stale' ? '上游暂时不可用，当前显示 ' + (cache.ageSeconds || 0) + ' 秒前缓存' : '数据已更新 · ' + (result.items || []).length + ' 条', cache.state === 'stale' ? 'stale' : '') }
      catch (error) { gridEl.innerHTML = ''; emptyEl.hidden = true; setStatus(error.message || '加载失败，请稍后重试', 'error') } finally { state.loading = false }
    }
    async function init() { try { const response = await call('explore.sources.list'); const result = response.result || response; state.sources = result.sources || []; state.source = result.defaultSource || state.sources[0]?.id || ''; renderSources(); renderFilters(); if (state.source) await load(); else setStatus('尚未启用探索来源', ''); } catch (error) { setStatus(error.message || '无法加载探索来源', 'error') } }
    $('refresh').onclick = () => { state.page = 1; load() }; $('health').onclick = async () => { setStatus('正在测试连接...', ''); try { const response = await call('explore.connection.test', { source: state.source }); const result = response.result || response; setStatus(result.message || '连接测试完成', result.ok ? '' : 'error') } catch (error) { setStatus(error.message || '连接测试失败', 'error') } }; $('prev').onclick = () => { if (state.page > 1) { state.page--; load() } }; $('next').onclick = () => { state.page++; load() }; init()
  </script>
</body>
</html>
