<svg width="400" height="200" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="missav-bg" x1="0" y1="0" x2="400" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1a2e"/>
      <stop offset="0.5" stop-color="#16213e"/>
      <stop offset="1" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="missav-accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e94560"/>
      <stop offset="1" stop-color="#f2b731"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" rx="12" fill="url(#missav-bg)"/>
  <!-- 搜索图标 -->
  <circle cx="80" cy="100" r="36" stroke="url(#missav-accent)" stroke-width="3" fill="none"/>
  <line x1="108" y1="128" x2="130" y2="150" stroke="url(#missav-accent)" stroke-width="4" stroke-linecap="round"/>
  <!-- 装饰圆点 -->
  <circle cx="160" cy="60" r="3" fill="#e94560" opacity="0.4"/>
  <circle cx="340" cy="40" r="4" fill="#f2b731" opacity="0.3"/>
  <circle cx="300" cy="160" r="3" fill="#e94560" opacity="0.3"/>
  <!-- 文字 -->
  <text x="160" y="90" font-family="Inter,sans-serif" font-size="22" font-weight="700" fill="#f4f1e9">MissAV</text>
  <text x="160" y="115" font-family="Inter,sans-serif" font-size="13" font-weight="400" fill="#aaa79f">元数据搜索引擎</text>
  <text x="160" y="135" font-family="Inter,sans-serif" font-size="11" font-weight="400" fill="#706e68">番号搜索 · 元数据抓取 · 独立隔离</text>
</svg>
