<svg width="400" height="200" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tmdb-bg" x1="0" y1="0" x2="400" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#161b22"/>
      <stop offset="1" stop-color="#1c2433"/>
    </linearGradient>
    <linearGradient id="tmdb-accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" rx="12" fill="url(#tmdb-bg)"/>
  <!-- 地球/代理图标 -->
  <circle cx="80" cy="100" r="36" stroke="url(#tmdb-accent)" stroke-width="3" fill="none"/>
  <ellipse cx="80" cy="100" rx="16" ry="36" stroke="url(#tmdb-accent)" stroke-width="2" fill="none"/>
  <line x1="44" y1="100" x2="116" y2="100" stroke="url(#tmdb-accent)" stroke-width="2"/>
  <line x1="48" y1="85" x2="112" y2="85" stroke="url(#tmdb-accent)" stroke-width="1.5" opacity="0.5"/>
  <line x1="48" y1="115" x2="112" y2="115" stroke="url(#tmdb-accent)" stroke-width="1.5" opacity="0.5"/>
  <!-- 箭头表示代理转发 -->
  <path d="M100 160 L120 160 L120 155 L130 162 L120 169 L120 164 L100 164 Z" fill="url(#tmdb-accent)" opacity="0.6"/>
  <!-- 装饰 -->
  <circle cx="340" cy="40" r="4" fill="#58a6ff" opacity="0.3"/>
  <circle cx="320" cy="170" r="3" fill="#38bdf8" opacity="0.3"/>
  <!-- 文字 -->
  <text x="160" y="90" font-family="Inter,sans-serif" font-size="22" font-weight="700" fill="#e6edf3">TMDB 代理</text>
  <text x="160" y="115" font-family="Inter,sans-serif" font-size="13" font-weight="400" fill="#8b949e">API 代理加速服务</text>
  <text x="160" y="135" font-family="Inter,sans-serif" font-size="11" font-weight="400" fill="#6e7681">Vercel 反代 · HTTP 代理 · 连接测试</text>
</svg>
